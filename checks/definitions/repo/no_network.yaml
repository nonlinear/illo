# Check: illo.repo.no-network
# Kin P09E092 check-contract §1 — every facet resolved. One file, one property.
# The check answers "which property?", never "why now?" (that is the trigger).

id: illo.repo.no-network
version: 1.0.0
predicate: zero_external_requests
source: local_static
target: index.html
lifecycle: active

context:
  requires: ["index.html"]

preconditions: []

execution:
  - action: scan
    args: {"for": ["fetch(", "XMLHttpRequest", "http://", "https://"]}

assertion: >
  index.html contains no network call

failure_classification:
  found: FAIL /ASSERTION

evidence:
  required: ["result.json", "stdout.log"]

# implementation — the check CONTRACT is above; this is one way to satisfy it
runner: checks/repo-no-network.sh
depends_on: []
