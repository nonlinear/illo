# Check: illo.repo.serving
# Kin P09E092 check-contract §1 — every facet resolved. One file, one property.
# The check answers "which property?", never "why now?" (that is the trigger).

id: illo.repo.serving
version: 1.0.0
predicate: local_server_answers
source: local_stack
target: http://127.0.0.1:3003/
lifecycle: active

context:
  requires: ["server"]

preconditions: ["port_3003_listening"]

execution:
  - action: http_get
    args: {"url": "http://127.0.0.1:3003/", "expect_status": 200}

assertion: >
  http_status == 200

failure_classification:
  no_server: ENVIRONMENT BLOCKED
  non_200: FAIL /ASSERTION

evidence:
  required: ["result.json", "stdout.log"]

# implementation — the check CONTRACT is above; this is one way to satisfy it
runner: checks/repo-serving.sh
depends_on: []
