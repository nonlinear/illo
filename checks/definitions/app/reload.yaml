# Check: illo.app.reload
# Kin P09E092 check-contract §1 — every facet resolved. One file, one property.
# The check answers "which property?", never "why now?" (that is the trigger).

id: illo.app.reload
version: 2.0.0
predicate: reload_is_not_a_dock_object
source: local_static
target: dock in index.html
lifecycle: active

# v1.0.0 asserted the OPPOSITE: a toolReload object after the tools. It was added on
# 2026-10-29 because the owner runs fullscreen on Android with no address bar. On 2026-11-11
# he removed it himself -- "eu tiraria todos os outros functions. cor, reload. so teria pen,
# eraser, undo, redo" -- so the property inverted. A check that keeps asserting a deleted
# object fails on a correct repo, which is worse than no check (kin P09E092 §3.3).

context:
  requires: ["index.html"]

preconditions: []

execution:
  - action: locate
    args: {"dock": "toolPen · toolEraser · toolUndo · toolRedo, and nothing else"}
  - action: forbid
    args: {"tokens": ["toolReload"]}

assertion: >
  The dock holds exactly pen, eraser, undo and redo. reloadApp() may exist for the laptop
  keyboard, but there is no reload object on the surface.

failure_classification:
  order: FAIL /ASSERTION
  extra_object: FAIL /ASSERTION

evidence:
  required: ["result.json", "stdout.log"]

runner: checks/app-reload.sh
depends_on: []
