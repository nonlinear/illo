# Check: illo.app.erase
# Kin P09E092 check-contract §1 — every facet resolved. One file, one property.
# The check answers "which property?", never "why now?" (that is the trigger).

id: illo.app.erase
version: 2.0.0
predicate: eraser_is_a_rubber
source: node
target: real eraseAt extracted from index.html
lifecycle: active

context:
  requires: ["index.html"]

preconditions: ["extraction_succeeded"]

execution:
  - action: extract_functions
    args: {"names": ["distToSeg", "radiusFor", "eraseRadius", "eraseAt"]}
  - action: run_cases
    args: {"file": ".erase-test.mjs"}

assertion: >
  7/7 cases pass. The properties are: (1) the ink under the finger goes; (2) the ink the
  finger never touched stays, to the point; (3) a stroke cut in two survives as two strokes;
  (4) a one-point stub is dropped, not left as a speck; (5) the demo scribble is never ink;
  (6) a miss says nothing; (7) the SAME touch on the SAME drawing gives the SAME answer,
  three times. That last one is the owner's complaint stated as an assertion: the old
  erase-to-intersection was right on a clean crossing and wrong on a line that merely came
  close, which is a coin, not a tool.

failure_classification:
  case_failed: FAIL /ASSERTION
  extraction_empty: FAIL /INFRASTRUCTURE

evidence:
  required: ["result.json", "stdout.log"]

# implementation — the check CONTRACT is above; this is one way to satisfy it
runner: checks/app-erase.sh
depends_on: []
